name: Build Release APK

# 发布 Release 时自动构建签名 APK 并挂到 Release；也可手动触发（Actions 页面 / gh workflow run）
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.1" "build-tools;33.0.2"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/hulian-${GITHUB_REF_NAME}.apk"
          ls -l out

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hulian-apk
          path: out/*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk